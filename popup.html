<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>interlogin</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div>
      <p class="title">interlogin</p>
      <p id="session-line" class="session">Checking the active tab…</p>
    </div>
    <button id="more-button" class="ghost" type="button" aria-expanded="false">More</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </header>

  <p id="status" class="status" hidden></p>

  <div id="more-panel" hidden>
  <div id="odoo-tools" class="tools">
    <button id="add-button" class="tool" type="button">Add</button>
    <button id="import-button" class="tool" type="button">Import</button>
    <button id="debug-switch" class="tool" type="button" title="Click: debug on or off. Double-click: assets debug.">Debug</button>
    <button id="fetch-button" class="tool" type="button" hidden>Fetch</button>
  </div>

  <form id="reset-form" class="editor" hidden>
    <label>
      New password for every user
      <input name="password" type="password" autocomplete="off">
    </label>
    <button class="danger" type="submit">Reset all passwords</button>
  </form>

  <section id="reset-confirm" class="confirm" hidden>
    <p id="reset-confirm-text"></p>
    <div class="editor-actions">
      <button id="reset-confirm-ok" class="danger" type="button">Reset all passwords</button>
      <button id="reset-confirm-cancel" class="text" type="button">Cancel</button>
    </div>
  </section>

  <form id="account-form" class="editor" hidden>
    <label>
      Username
      <input name="username" type="text" autocomplete="off" placeholder="Optional">
    </label>
    <label>
      Email
      <input name="email" type="text" autocomplete="off" required>
    </label>
    <label>
      Password
      <input name="password" type="password" autocomplete="off" required>
    </label>
    <div class="editor-actions">
      <button class="save" type="submit">Save</button>
      <button id="cancel-add" class="text" type="button">Cancel</button>
    </div>
  </form>
  </div>

  <ul id="account-list" class="accounts"></ul>

  <footer class="foot">
    <p class="brand">interlogin by <a href="https://github.com/stephenprasetyachrismawan" target="_blank" rel="noopener noreferrer">stephenprasetyachrismawan</a></p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
